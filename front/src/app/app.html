<div class="border border-surface-200 dark:border-surface-700 rounded-lg overflow-hidden">
  <p-sidebar-layout class="min-h-192! relative!">
    @if (isMobile()) {
      <p-sidebar-backdrop class="absolute!" />
    }
    <p-sidebar
      id="mobile-nav"
      [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
      [overlay]="isMobile()"
      [open]="!isMobile()"
      width="14rem"
    >
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-header>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1!">
                  <div
                    class="flex size-6 shrink-0 items-center justify-center rounded-md bg-linear-to-br from-violet-500 to-indigo-600 text-white text-xs font-bold leading-none"
                  >
                    A
                  </div>
                  <span class="font-semibold text-sm"
                    >Parcial 1 ({{ this.authService.user()?.username }})</span
                  >
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-header>
          <p-sidebar-content>
            <p-sidebar-group>
              <p-sidebar-group-label>Menu</p-sidebar-group-label>
              <p-sidebar-group-content>
                <p-sidebar-menu>
                  <p-sidebar-menu-item>
                    <button
                      pSidebarMenuButton
                      routerLink="/home"
                      routerLinkActive
                      #homeActive="routerLinkActive"
                      [isActive]="homeActive.isActive"
                    >
                      <svg data-p-icon="home"></svg>
                      <span>Home</span>
                    </button>
                  </p-sidebar-menu-item>
                  <p-sidebar-menu-item>
                    <button
                      pSidebarMenuButton
                      routerLink="/tareas"
                      routerLinkActive
                      #tareasActive="routerLinkActive"
                      [isActive]="tareasActive.isActive"
                    >
                      <svg data-p-icon="list-check"></svg>
                      <span>Tareas</span>
                    </button>
                  </p-sidebar-menu-item>
                  <p-sidebar-menu-item>
                    <button
                      pSidebarMenuButton
                      routerLink="/usuarios"
                      routerLinkActive
                      #usuariosActive="routerLinkActive"
                      [isActive]="usuariosActive.isActive"
                    >
                      <svg data-p-icon="users"></svg>
                      <span>Usuarios</span>
                    </button>
                  </p-sidebar-menu-item>
                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
          </p-sidebar-content>
          <p-sidebar-footer>
            <p-sidebar-menu>
              <p-sidebar-menu-item>
                <button pSidebarMenuButton class="p-1!">
                  <p-avatar label="JD" shape="circle" class="size-6 shrink-0 text-xs" />
                  <span>John Doe</span>
                </button>
              </p-sidebar-menu-item>
            </p-sidebar-menu>
          </p-sidebar-footer>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>
    <p-sidebar-main>
      <header
        class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
      >
        <button pButton pSidebarTrigger target="mobile-nav" severity="secondary" text size="small">
          <svg data-p-icon="sidebar"></svg>
        </button>
        <span class="text-sm font-medium">Dashboard</span>
        <span
          class="ml-auto text-xs text-muted-color rounded-md bg-surface-100 dark:bg-surface-800 px-2 py-1"
          >{{ isMobile() ? 'Mobile' : 'Desktop' }}</span
        >
      </header>
      <div class="flex-1 p-4 flex flex-col gap-1">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>
</div>
